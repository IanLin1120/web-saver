plugins { id 'com.android.application' }

def appVer = rootProject.file('VERSION').text.trim()
def verParts = appVer.tokenize('.')
def verCode = (verParts[0] as int) * 10000 + (verParts[1] as int) * 100 + (verParts[2] as int)

android {
    namespace 'com.ian.websaver'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ian.websaver'
        minSdk 26
        targetSdk 34
        versionCode verCode
        versionName appVer
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 只用來關掉 WebView 每個請求都會帶的 X-Requested-With 標頭（一般瀏覽器不會送，有些網站的資安防護會因此擋下來）
    implementation 'androidx.webkit:webkit:1.11.0'
}
